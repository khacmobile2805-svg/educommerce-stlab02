name: tests

on:
  push:
  pull_request:

jobs:
  run-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Suite on the original application (defect DEF-PMS-001 is expected to be found)
        run: |
          python test_runner.py reports_ci
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("reports_ci/test_execution.csv", encoding="utf-8-sig")))
          fails = sorted(r["test_case_id"] for r in rows if r["execution_status"] == "FAIL")
          assert len(rows) == 22, len(rows)
          assert fails == ["TC-PMS-002", "TC-PMS-004"], fails
          assert not any(r["execution_status"] == "BLOCKED" for r in rows)
          PY

      - name: Regression on the fixed copy (everything must pass)
        run: |
          APP_MODULE=ecommerce_app_fixed python test_runner.py reports_ci_fixed
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("reports_ci_fixed/test_execution.csv", encoding="utf-8-sig")))
          assert len(rows) == 22 and all(r["execution_status"] == "PASS" for r in rows)
          PY
