name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Ứng dụng gốc (lỗi đã biết DEF-PMS-001 đánh dấu xfail-strict)
        run: pytest -q --junitxml=junit-original.xml

      - name: Bản sửa (regression, tất cả phải pass)
        run: APP_MODULE=ecommerce_app_fixed pytest -q --junitxml=junit-fixed.xml

      - name: Báo cáo HTML/Excel từ runner CSV
        run: |
          python test_runner.py reports_ci
          APP_MODULE=ecommerce_app_fixed python test_runner.py reports_ci_fixed

      - name: Cổng mutation (bộ test phải bắt mọi mutant cài sẵn)
        run: python mutation_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit-*.xml
            reports_ci*/
